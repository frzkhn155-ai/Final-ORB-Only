name: Upstox Trading Bot (ORB Only)

on:
  schedule:
    - cron: '40 3 * * 1-5'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual trigger'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-bot:
    name: Run ORB Trading Bot
    runs-on: ubuntu-latest
    timeout-minutes: 390

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xclip xdotool xvfb

      - name: Install Google Chrome (Modern Method)
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          wget -qO- https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
          sudo chmod a+r /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Restore candle cache
        uses: actions/cache@v4
        with:
          path: candle_cache/
          key: candle-cache-orb-${{ runner.os }}
          restore-keys: candle-cache-orb-${{ runner.os }}-

      - name: Restore Upstox token
        uses: actions/cache@v4
        with:
          path: |
            upstox_token.txt
            upstox_refresh_token.txt
            token_timestamp.json
          key: upstox-token-${{ runner.os }}

      - name: Run trading bot
        env:
          UPSTOX_EMAIL:      ${{ secrets.UPSTOX_EMAIL }}
          UPSTOX_PASSWORD:   ${{ secrets.UPSTOX_PASSWORD }}
          UPSTOX_MOBILE:     ${{ secrets.UPSTOX_MOBILE }}
          UPSTOX_PASSCODE:   ${{ secrets.UPSTOX_PASSCODE }}
          UPSTOX_API_KEY:    ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_TOKEN:      ${{ secrets.UPSTOX_TOKEN }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          python Both4withcache10_headless.py

      - name: Sync token to both repos
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "⚠️ GH_PAT not set — skipping cross-repo sync."
            exit 0
          fi
          if [ -f upstox_token.txt ]; then
            TOKEN_VALUE=$(cat upstox_token.txt | tr -d '[:space:]')
            if [ -n "$TOKEN_VALUE" ]; then
              echo "Syncing token..."
              gh secret set UPSTOX_TOKEN --body "$TOKEN_VALUE" --repo frzkhn155-ai/Final-ORB-Only
              gh secret set UPSTOX_TOKEN --body "$TOKEN_VALUE" --repo frzkhn155-ai/Final
            fi
          fi

      - name: Save token cache
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            upstox_token.txt
            upstox_refresh_token.txt
            token_timestamp.json
          key: upstox-token-${{ runner.os }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-logs-${{ github.run_id }}
          retention-days: 30
          path: |
            *.txt
            *.csv
            crash_log.txt
